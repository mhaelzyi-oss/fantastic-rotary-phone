<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KUI Video Extractor</title>
    <style>
      html, body { margin: 0; background: #11100c; color: #f5f0df; font-family: Arial, sans-serif; overflow: hidden; }
      .stage { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 48px; }
      h1 { margin: 12px 0 0; font-size: 72px; letter-spacing: -0.04em; }
      .kicker { letter-spacing: 0.2em; text-transform: uppercase; color: #e4c56f; font-size: 18px; }
      .tools { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin-top: 28px; color: #e4c56f; letter-spacing: 0.12em; text-transform: uppercase; }
      .logo { height: 72px; width: auto; }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="logo" src="../branding/krypton-ultimate-inc-ii.svg" alt="" />
      <div class="kicker">Krypton Ultimate Inc II</div>
      <h1>KUI Video Extractor</h1>
      <div class="tools">
        <span>Detect</span><span>Analyze</span><span>Quality</span><span>Library</span><span>Names</span><span>Extractor</span>
      </div>
    </div>
  </body>
</html>
