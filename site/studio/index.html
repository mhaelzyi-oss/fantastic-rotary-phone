<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Studio | KUI Video Extractor</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-studio-hash="{{STUDIO_HASH}}">
    <main id="main" class="doc glass studio">
      <p class="brand">Krypton Ultimate Inc II</p>
      <h1>Studio</h1>
      <p class="muted">Private counts. Not linked from the site.</p>
      <form id="gate" class="studio-gate" autocomplete="off">
        <label class="sr" for="key">Passphrase</label>
        <input id="key" name="key" type="password" required placeholder="Passphrase" />
        <button class="btn btn-blue" type="submit">Open</button>
      </form>
      <p class="status" id="status" hidden></p>
      <div class="pulse" id="pulse" hidden>
        <div><b id="here">—</b><span>Now</span></div>
        <div><b id="visits">—</b><span>Visits</span></div>
        <div><b id="downloads">—</b><span>Downloads</span></div>
      </div>
    </main>
    <script src="/studio/studio.js"></script>
  </body>
</html>
