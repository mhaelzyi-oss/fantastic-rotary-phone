<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Music | KUI Video Extractor</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'" />
    <link rel="stylesheet" href="shared/kui.css" />
  </head>
  <body>
    <div class="ornaments" aria-hidden="true">
      <svg class="o1" viewBox="0 0 96 96"><path d="M48 7 83 27v42L48 89 13 69V27z"/><path d="m35 27 0 42m0-21 27-21M35 48l29 21"/></svg>
      <svg class="o2" viewBox="0 0 96 96"><path d="M48 7 83 27v42L48 89 13 69V27z"/><path d="m35 27 0 42m0-21 27-21M35 48l29 21"/></svg>
      <svg class="o3" viewBox="0 0 96 96"><path d="M48 7 83 27v42L48 89 13 69V27z"/><path d="m35 27 0 42m0-21 27-21M35 48l29 21"/></svg>
    </div>
    <main class="wrap">
      <section class="card glass">
        <p class="brand">KUI Video Extractor</p>
        <p class="kicker">Free tool</p>
        <h1>Add Music</h1>
        <p class="muted">Mux a local audio file onto a local video. The original soundtrack is replaced.</p>
        <div class="pair" id="drop">
          <div class="drop" id="drop-video" role="button" tabindex="0">Video<input id="file-video" type="file" accept="video/*,.mp4,.m4v,.mov" /></div>
          <div class="drop" id="drop-audio" role="button" tabindex="0">Audio<input id="file-audio" type="file" accept="audio/*,.m4a,.mp4,.mov" /></div>
        </div>
        <p class="files" id="files"></p>
        <button class="btn" id="run" type="button">Mux</button>
        <p class="status" id="status" role="status"></p>
        <p class="fine">This page only reads the files you pick.</p>
      </section>
    </main>
    <script src="shared/kui-mp4.js"></script>
    <script src="shared/kui-ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
