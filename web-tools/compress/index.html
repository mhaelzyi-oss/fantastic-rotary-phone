<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Compressor | KUI Video Extractor</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'" />
    <link rel="stylesheet" href="shared/kui.css" />
  </head>
  <body>
    <div class="ornaments" aria-hidden="true">
      <svg class="o1" viewBox="0 0 96 96"><path d="M48 7 83 27v42L48 89 13 69V27z"/><path d="m35 27 0 42m0-21 27-21M35 48l29 21"/></svg>
      <svg class="o2" viewBox="0 0 96 96"><path d="M48 7 83 27v42L48 89 13 69V27z"/><path d="m35 27 0 42m0-21 27-21M35 48l29 21"/></svg>
      <svg class="o3" viewBox="0 0 96 96"><path d="M48 7 83 27v42L48 89 13 69V27z"/><path d="m35 27 0 42m0-21 27-21M35 48l29 21"/></svg>
    </div>
    <main class="wrap">
      <section class="card glass">
        <p class="brand">KUI Video Extractor</p>
        <p class="kicker">Free tool</p>
        <h1>Video Compressor</h1>
        <p class="muted">Re-encode a local video in this browser. Saves MP4 when H.264 encoding is available, otherwise WebM.</p>
        <div class="drop" id="drop" role="button" tabindex="0"><b>Drop your video here</b><small>or click to browse</small><input id="file" type="file" accept="video/*" /></div>
        <p class="files" id="files"></p>
        <div class="pair opts" hidden>
          <label>Scale <span id="scale-label">70%</span><input id="scale" type="range" min="40" max="100" value="70" /></label>
          <label>Quality <span id="quality-label">60%</span><input id="quality" type="range" min="20" max="100" value="60" /></label>
        </div>
        <button class="btn" id="run" type="button" hidden>Compress</button>
        <p class="status" id="status" role="status"></p>
        <p class="fine">This page only reads the file you pick.</p>
      </section>
    </main>
    <script src="shared/kui-mp4.js"></script>
    <script src="shared/kui-ui.js"></script>
    <script src="shared/kui-codecs.js"></script>
    <script src="app.js"></script>
  </body>
</html>
